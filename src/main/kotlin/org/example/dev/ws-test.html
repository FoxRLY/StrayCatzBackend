<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>straycatz test client</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; max-width: 1000px; }
  input, select, textarea, button { font: inherit; }
  input { padding: 2px 4px; }
  textarea { width: 100%; height: 80px; font-family: ui-monospace, monospace; box-sizing: border-box; }
  fieldset { border: 1px solid #ccc; border-radius: 6px; margin: 10px 0; }
  legend { font-weight: 600; }
  .log { white-space: pre-wrap; font: 12px ui-monospace, monospace; background: #f4f4f4; padding: 8px; overflow: auto; }
  #log { height: 320px; } #rest-out { height: 220px; }
  .row { display: flex; gap: 8px; margin: 6px 0; flex-wrap: wrap; align-items: center; }
  .who { font-weight: 600; }
</style>
</head>
<body>
<h3>straycatz — тестовый клиент (REST + WebSocket)</h3>

<fieldset>
  <legend>1. Кто я</legend>
  <div class="row">
    <label>API <input id="api" size="24" value="http://localhost:8080"></label>
    <label>WS <input id="url" size="28" value="ws://localhost:8080/v1/ws"></label>
  </div>
  <div class="row">
    <b>Регистрация:</b>
    <input id="r-username" placeholder="логин" size="12">
    <input id="r-email" placeholder="email" size="18">
    <input id="r-password" placeholder="пароль (8+)" type="password" size="12">
    <button id="register">register</button>
  </div>
  <div class="row">
    <b>Вход:</b>
    <input id="l-login" placeholder="логин или email" size="18" value="alice">
    <input id="l-password" placeholder="пароль" type="password" size="12" value="alice">
    <button id="login">login</button>
    <button id="refresh">refresh</button>
    <button id="logout">logout</button>
  </div>
  <div class="row">
    <b>или dev-юзер (без Keycloak):</b>
    <select id="dev">
      <option value="">— не использовать —</option>
      <option value="11111111-1111-1111-1111-111111111111">alice</option>
      <option value="22222222-2222-2222-2222-222222222222">bob</option>
      <option value="33333333-3333-3333-3333-333333333333">carol</option>
    </select>
  </div>
  <div class="row">Сейчас: <span class="who" id="who">никто</span></div>
</fieldset>

<fieldset>
  <legend>2. REST</legend>
  <div class="row">
    <button data-get="/api/users/me">GET me</button>
    <button data-get="/api/chats">GET chats</button>
    <button data-get="/api/friends">GET friends</button>
    <label>chatId <input id="chat" size="38" value="aaaaaaaa-0000-0000-0000-000000000001"></label>
    <button id="hist">история (последние)</button>
    <button id="older">ещё старее</button>
  </div>
  <div class="row">
    <select id="method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select>
    <input id="path" size="40" value="/api/users?q=b">
    <button id="do">отправить</button>
  </div>
  <textarea id="body" placeholder='тело запроса (JSON), напр. {"type":"direct","userId":"33333333-3333-3333-3333-333333333333"}'></textarea>
  <div class="log" id="rest-out"></div>
</fieldset>

<fieldset>
  <legend>3. WebSocket</legend>
  <div class="row">
    <button id="connect">connect</button>
    <button id="close">close</button>
    <select id="tpl">
      <option value='{"t":"hello","d":{}}'>hello</option>
      <option value='{"t":"chat.open","d":{"chatId":"__chat__"}}'>chat.open</option>
      <option value='{"t":"message.send","rid":"r1","d":{"chatId":"__chat__","body":"мяу","clientToken":"__uuid__"}}'>message.send</option>
      <option value='{"t":"typing","d":{"chatId":"__chat__"}}'>typing</option>
      <option value='{"t":"message.read","d":{"chatId":"__chat__","seq":1}}'>message.read</option>
      <option value='{"t":"message.edit","d":{"chatId":"__chat__","messageId":"<id из ack>","body":"исправил"}}'>message.edit</option>
      <option value='{"t":"message.delete","d":{"chatId":"__chat__","messageId":"<id из ack>"}}'>message.delete</option>
      <option value='{"t":"presence.set","d":{"status":"away","doing":"читаю"}}'>presence.set</option>
      <option value='{"t":"presence.query","rid":"q1","d":{"userIds":["11111111-1111-1111-1111-111111111111","22222222-2222-2222-2222-222222222222","33333333-3333-3333-3333-333333333333"]}}'>presence.query</option>
      <option value='{"t":"ping","rid":"p1"}'>ping</option>
    </select>
    <button id="use">подставить</button>
    <button id="send">send</button>
  </div>
  <textarea id="frame">{"t":"hello","d":{}}</textarea>
  <div class="log" id="log"></div>
</fieldset>

<script>
  const $ = (id) => document.getElementById(id);
  let ws, accessToken = '', refreshToken = '', oldestSeq = null;

  const log = (el, text) => { el.textContent += text + '\n'; el.scrollTop = el.scrollHeight; };
  const wsLog = (dir, t) => log($('log'), `${dir} ${t}`);
  const restLog = (t) => log($('rest-out'), t);

  function authHeader() {
    if (accessToken) return 'Bearer ' + accessToken;
    if ($('dev').value) return 'Dev ' + $('dev').value;
    return null;
  }
  function setWho(text) { $('who').textContent = text; }

  async function api(method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    const a = authHeader(); if (a) headers['Authorization'] = a;
    const res = await fetch($('api').value + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const text = await res.text();
    let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
    restLog(`${method} ${path} -> ${res.status}\n${text ? JSON.stringify(data, null, 2) : ''}`);
    return { status: res.status, data };
  }

  function onAuth(r) {
    if (r.status >= 300) return;
    accessToken = r.data.tokens.accessToken; refreshToken = r.data.tokens.refreshToken;
    $('dev').value = '';
    setWho(`${r.data.user.username} (${r.data.user.id}) — JWT, живёт ${r.data.tokens.expiresIn}с`);
  }

  $('register').onclick = async () => onAuth(await api('POST', '/api/auth/register', {
    username: $('r-username').value, email: $('r-email').value, password: $('r-password').value }));
  $('login').onclick = async () => onAuth(await api('POST', '/api/auth/login', {
    login: $('l-login').value, password: $('l-password').value }));
  $('refresh').onclick = async () => {
    const r = await api('POST', '/api/auth/refresh', { refreshToken });
    if (r.status < 300) { accessToken = r.data.accessToken; refreshToken = r.data.refreshToken; }
  };
  $('logout').onclick = async () => {
    await api('POST', '/api/auth/logout', { refreshToken });
    accessToken = refreshToken = ''; setWho('никто');
  };
  $('dev').onchange = () => {
    accessToken = refreshToken = '';
    setWho($('dev').value ? `dev ${$('dev').selectedOptions[0].text}` : 'никто');
  };

  document.querySelectorAll('[data-get]').forEach(b => b.onclick = () => api('GET', b.dataset.get));
  $('hist').onclick = async () => {
    const r = await api('GET', `/api/chats/${$('chat').value}/messages?limit=20`);
    if (r.status < 300 && r.data.messages.length) oldestSeq = r.data.messages[0].seq;
  };
  $('older').onclick = async () => {
    if (oldestSeq == null) return restLog('сначала «история (последние)»');
    const r = await api('GET', `/api/chats/${$('chat').value}/messages?before=${oldestSeq}&limit=20`);
    if (r.status < 300 && r.data.messages.length) oldestSeq = r.data.messages[0].seq;
  };
  $('do').onclick = () => {
    const raw = $('body').value.trim();
    let body; try { body = raw ? JSON.parse(raw) : undefined; } catch { return restLog('тело — не JSON'); }
    api($('method').value, $('path').value, body);
  };

  $('connect').onclick = () => {
    const auth = accessToken ? `bearer.${accessToken}` : ($('dev').value ? `dev.${$('dev').value}` : null);
    if (!auth) return wsLog('--', 'сначала войди или выбери dev-юзера');
    ws = new WebSocket($('url').value, ['straycatz.v1', auth]);
    ws.onopen = () => wsLog('--', `open, protocol=${ws.protocol}`);
    ws.onmessage = (e) => wsLog('<-', e.data);
    ws.onclose = (e) => wsLog('--', `close code=${e.code} reason=${e.reason}`);
  };
  $('close').onclick = () => ws && ws.close();
  $('use').onclick = () => {
    $('frame').value = $('tpl').value.replaceAll('__uuid__', crypto.randomUUID()).replaceAll('__chat__', $('chat').value);
  };
  $('send').onclick = () => {
    if (!ws || ws.readyState !== 1) return wsLog('--', 'сокет не подключён');
    const f = $('frame').value; ws.send(f); wsLog('->', f);
  };
</script>
</body>
</html>
