services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: straycatz
      POSTGRES_USER: straycatz
      POSTGRES_PASSWORD: straycatz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: [ "start-dev", "--import-realm" ]

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/straycatz
      KC_DB_USERNAME: straycatz
      KC_DB_PASSWORD: straycatz

      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost:8180

    ports:
      - "8180:8080"

    depends_on:
      - postgres

    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  pgdata: