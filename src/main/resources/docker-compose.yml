services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: straycatz
      POSTGRES_USER: straycatz
      POSTGRES_PASSWORD: straycatz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Шина событий между нодами (pub/sub). Данные не хранит — volume не нужен.
  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--save", "", "--appendonly", "no", "--maxclients", "20000" ]
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: [ "start-dev", "--import-realm" ]

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/straycatz
      KC_DB_USERNAME: straycatz
      KC_DB_PASSWORD: straycatz

      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost:8180

    ports:
      - "8180:8080"

    depends_on:
      - postgres

    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
  # S3-совместимое хранилище для картинок и видео.
  # API: http://localhost:9000, консоль: http://localhost:9001 (straycatz / straycatz-secret)
  minio:
    image: minio/minio:latest
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: straycatz
      MINIO_ROOT_PASSWORD: straycatz-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
  # Стримы: принимает RTMP от OBS и раздаёт зрителям HLS/WebRTC без перекодирования.
  # Кого пускать — спрашивает у бэкенда (auth-хук), см. mediamtx/mediamtx.yml.
  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    extra_hosts:
      # бэкенд запущен на хосте (quarkus dev) — до него из контейнера так
      - "host.docker.internal:host-gateway"
    ports:
      - "1935:1935"            # RTMP (OBS)
      - "8888:8888"            # HLS (зрители)
      - "8889:8889"            # WebRTC WHEP (зрители)
      - "8189:8189/udp"        # WebRTC медиа
      - "127.0.0.1:9997:9997"  # API — только для бэкенда, наружу не открывать

volumes:
  pgdata:
  kcdata:
  miniodata: