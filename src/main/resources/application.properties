# ---------------------------------------------------------------- БД
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=straycatz
quarkus.datasource.password=straycatz
# JDBC — для Hibernate ORM/Panache и Flyway (вся бизнес-логика)
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/straycatz
# reactive url — только для LISTEN, если шина на Postgres (straycatz.bus.transport=pg)
quarkus.datasource.reactive.url=vertx-reactive:postgresql://localhost:5432/straycatz
quarkus.datasource.reactive.max-size=4
quarkus.datasource.devservices.enabled=false

quarkus.hibernate-orm.database.generation=none

#quarkus.flyway.migrate-at-start=true
#quarkus.flyway.baseline-on-migrate=true
# база уже поднята руками до V15 включительно? раскомментируй один раз, иначе Flyway
# начнёт с V2 поверх существующих таблиц:
#quarkus.flyway.baseline-version=15
quarkus.flyway.locations=db/migration
# в dev дополнительно тестовые юзеры/чаты (db/dev/R__dev_seed.sql)
%dev.quarkus.flyway.locations=db/migration,db/dev

# ---------------------------------------------------------------- Auth / Keycloak
# JWT из Keycloak проверяется по его публичным ключам (JWKS), подпись RS256.
# ВАЖНО: issuer должен совпадать с тем адресом, по которому ФРОНТ получил
# токен (iss в токене). В проде — публичный https-адрес Keycloak.
straycatz.keycloak.url=http://localhost:8180
straycatz.keycloak.realm=straycatz
# Сокет берёт адрес из straycatz.keycloak.* (AuthService собирает парсер сам).
# mp.jwt.* ниже нужны только если подключишь quarkus-smallrye-jwt для REST
# (@Authenticated / @RolesAllowed) — без расширения это просто предупреждение в логе.
mp.jwt.verify.publickey.location=${straycatz.keycloak.url}/realms/${straycatz.keycloak.realm}/protocol/openid-connect/certs
mp.jwt.verify.issuer=${straycatz.keycloak.url}/realms/${straycatz.keycloak.realm}
mp.jwt.verify.publickey.algorithm=RS256
# Проверять aud, если настроишь в Keycloak audience-mapper на клиент straycatz-api:
#mp.jwt.verify.audiences=straycatz-api

# Клиенты realm'а (см. keycloak/straycatz-realm.json):
#  straycatz-web     — public, от его имени логиним пользователей (password grant)
#  straycatz-backend — confidential + service account с manage-users: создаёт/блокирует юзеров
straycatz.keycloak.public-client-id=straycatz-web
straycatz.keycloak.admin-client-id=straycatz-backend
# в проде — из переменной окружения STRAYCATZ_KEYCLOAK_ADMIN_CLIENT_SECRET, не в файле
straycatz.keycloak.admin-client-secret=dev-backend-secret-change-me

straycatz.auth.username-claim=preferred_username
# dev.<uuid> вместо JWT — только локально, пока нет логина на фронте
straycatz.auth.allow-dev-tokens=false
%dev.straycatz.auth.allow-dev-tokens=true

# ---------------------------------------------------------------- websockets-next
# сервер отвечает на апгрейд выбранным сабпротоколом straycatz.v1
quarkus.websockets-next.server.supported-subprotocols=straycatz.v1

# ---------------------------------------------------------------- медиа (S3 / MinIO)
# s3 — MinIO/AWS/Yandex Object Storage; local — папка на диске (без MinIO)
straycatz.media.storage=s3
straycatz.media.dir=data/media
straycatz.media.max-bytes=10485760
# видео (mp4/webm) для пульса — отдельный лимит
straycatz.media.max-video-bytes=52428800
# аватар (PUT /api/users/me/avatar) — только картинки
straycatz.media.max-avatar-bytes=5242880
# аудио (mp3/m4a/ogg/flac/wav) для музыки
straycatz.media.max-audio-bytes=31457280
# Если фронт и API на разных доменах — полный адрес API (url картинок станет абсолютным).
# ВАЖНО: не оставляй свойство пустым ("key=") — SmallRye считает это ошибкой. Не нужно — закомментируй.
#straycatz.media.public-base-url=https://api.straycatz.example

# MinIO из docker-compose. В проде — адрес провайдера и ключи из переменных окружения
# (STRAYCATZ_S3_ACCESS_KEY / STRAYCATZ_S3_SECRET_KEY), а не из этого файла.
straycatz.s3.endpoint=http://localhost:9000
straycatz.s3.region=us-east-1
straycatz.s3.bucket=straycatz-media
straycatz.s3.access-key=straycatz
straycatz.s3.secret-key=straycatz-secret
# MinIO и большинство S3-совместимых требуют path-style (http://host/bucket/key)
straycatz.s3.path-style=true
# сколько живёт presigned-ссылка на файл
straycatz.s3.presign-ttl=PT1H
# если бакет публичный или стоит CDN — отдавать прямые ссылки вместо presigned
#straycatz.s3.public-url=https://cdn.straycatz.example
# в dev бакет создаётся сам при старте
%dev.straycatz.s3.create-bucket=true
# лимит тела запроса чуть больше max-video-bytes (multipart добавляет заголовки)
quarkus.http.limits.max-body-size=55M

# ---------------------------------------------------------------- стримы (MediaMTX)
# OBS шлёт RTMP в MediaMTX, тот раздаёт зрителям HLS/WebRTC без перекодирования.
# Бэкенд: проверяет ключи (auth-хук) и раз в 5 с сверяет, какие эфиры идут.
straycatz.streams.enabled=true
# что показать в OBS в поле «Сервер»
straycatz.streams.rtmp-url=rtmp://localhost:1935/live
# откуда браузер берёт видео (в проде — публичные адреса / CDN перед MediaMTX)
straycatz.streams.hls-url=http://localhost:8888
straycatz.streams.webrtc-url=http://localhost:8889
# API MediaMTX — только изнутри
straycatz.streams.api-url=http://localhost:9997
# общий секрет с authHTTPAddress в mediamtx/mediamtx.yml. В проде — из переменной окружения.
straycatz.streams.hook-secret=dev-mediamtx-hook-secret

# откуда сервер снимает живые кадры эфиров для превью (читает RTMP у MediaMTX)
straycatz.streams.thumb-source=rtmp://localhost:1935/live

# ---------------------------------------------------------------- превью (ffmpeg)
# Кадр-обложка и длительность загруженных видео, живые кадры эфиров.
# Нужны ffmpeg и ffprobe на машине бэкенда (apt install ffmpeg / brew install ffmpeg).
# Нет их — превью просто не делаются, остальное работает (в логе одно предупреждение).
straycatz.ffmpeg.enabled=true
straycatz.ffmpeg.path=ffmpeg
straycatz.ffmpeg.ffprobe-path=ffprobe

# ---------------------------------------------------------------- гифки и внешние стикеры
# Откуда искать: klipy (бесплатно, бывшая команда Tenor — https://partner.klipy.com),
# giphy (beta-ключ ~100 запросов/час, для прода — production-ключ), none — только своя библиотека.
# Tenor API закрыт с 30.06.2026 — его не подключаем.
straycatz.gifs.provider=klipy
# ключи — из переменных окружения STRAYCATZ_GIFS_KLIPY_KEY / STRAYCATZ_GIFS_GIPHY_KEY
straycatz.gifs.klipy-key=62Ufy0BndXZKJjWx68AtRi0W2OdbK7jSqsg5PeuwRZsYgBcWocsjrFRWUbltrTUA
#straycatz.gifs.giphy-key=
# KLIPY ждёт локаль вида ru_RU
straycatz.gifs.locale=ru_RU
# klipy: off / low / medium / high
straycatz.gifs.content-filter=medium
# сколько максимум весит гифка, которую качаем к себе
straycatz.gifs.max-bytes=8388608

# ---------------------------------------------------------------- исходящие запросы (KLIPY/GIPHY, Telegram)
# Если из сети сервера внешний сервис не открывается (запрос висит до таймаута) — HTTP-прокси:
#straycatz.http.proxy=http://127.0.0.1:3128
straycatz.http.timeout=PT10S

# ---------------------------------------------------------------- Telegram
# Зеркала публичных каналов читают t.me/s/<канал> — токен не нужен.
straycatz.telegram.mirror.enabled=true
# сколько каналов один человек может добавить за сутки
straycatz.telegram.mirror.per-user-per-day=5
# Импорт наборов стикеров (t.me/addstickers/…) — через Bot API: токен любого бота от @BotFather.
# В прод — из переменной окружения STRAYCATZ_TELEGRAM_BOT_TOKEN.
straycatz.telegram.bot-token=8885409292:AAFWT4sceaajCurqKXZjUwV8EX24sP5A4nM

# ---------------------------------------------------------------- http / CORS / логи
quarkus.http.port=8080
# В dev Quarkus по умолчанию слушает только localhost — тогда MediaMTX из docker
# не достучится до auth-хука (connection refused на host.docker.internal:8080).
# Слушаем все интерфейсы; в проде (не %dev) Quarkus и так слушает 0.0.0.0.
%dev.quarkus.http.host=0.0.0.0
# фронт на другом порту ходит в /api/* — нужен CORS.
# (в Quarkus < 3.13 свойство называлось quarkus.http.cors=true)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000,http://localhost:8000
# в dev пускаем любой origin (в т.ч. "null" у открытого с диска dev/ws-test.html)
%dev.quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.log.level=INFO
quarkus.log.category."org.example".level=DEBUG


# ---- Presence: бездействие → «отошёл» / «не в сети» (ISO-8601 длительности)
straycatz.presence.away-after=PT10M
straycatz.presence.offline-after=PT30M

# ---- Значки: часовой пояс для «Ночного сторожа» (00:00–06:00) и саммари «чем занят»
straycatz.badges.night-zone=Europe/Moscow

# ---- «ИИ слоп»: плашка, когда голосов >= slop-percent% от просмотревших и не меньше slop-min-votes
straycatz.posts.slop-percent=20
straycatz.posts.slop-min-votes=5

# ---- Зеркала Telegram: каналов за тик (раз в минуту) и одновременно
straycatz.telegram.mirror.batch=20
straycatz.telegram.mirror.parallel=4

# ---- Шина событий между нодами (EventBus): redis — прод и 100k соединений, pg — одна нода без Redis
straycatz.bus.transport=redis
straycatz.redis.url=redis://localhost:6379
# префикс каналов: разные окружения могут делить один Redis
straycatz.bus.prefix=sc
# сколько параллельных очередей приёма (порядок внутри чата сохраняется)
straycatz.bus.lanes=8
# Redis-клиент Quarkus сами не используем (берём vertx-redis-client напрямую) — не поднимать контейнер
quarkus.redis.hosts=${straycatz.redis.url}
quarkus.redis.devservices.enabled=false

# ---- Сокеты: ws-ping раз в 30 с — мёртвые соединения закрываются, балансировщик не рвёт простаивающие
quarkus.websockets-next.server.auto-ping-interval=30s

# ---- Пул JDBC на ноду. Нод много — ставь PgBouncer (transaction mode) между нодами и Postgres
quarkus.datasource.jdbc.max-size=40

# ---- Звонки: LiveKit (SFU). Медиа идёт мимо бэкенда; бэкенд выдаёт токены и слушает вебхуки
# адрес для браузера (в проде wss://livekit.straycatz.example)
straycatz.livekit.url=ws://localhost:7880
# адрес серверного API для бэкенда (в проде — внутренний, http://livekit:7880)
straycatz.livekit.api-url=http://localhost:7880
straycatz.livekit.api-key=devkey
# секрет — не короче 32 символов; в проде только из STRAYCATZ_LIVEKIT_API_SECRET
straycatz.livekit.api-secret=devsecret-straycatz-change-me-32chars-min
# токен только на подключение — подключённым LiveKit продлевает его сам
straycatz.livekit.token-ttl=PT10M
# до скольких участников чата звонок «звенит»; в больших группах — плашка «идёт звонок»
straycatz.calls.ring-max=16
straycatz.calls.max-participants=100
# голосовые каналы сообществ: сколько может «только смотреть» стрим (говорящих — у канала, 2–100)
straycatz.voice.max-watchers=500

# ---------------------------------------------------------------- модерация (V20)
# Кто модератор/диктатор = staff_grant в базе ∪ realm-роль из токена Keycloak ∪ этот список.
# «Первые диктаторы»: username или uuid через запятую. Так назначается самый первый диктатор
# на чистой установке (себя): STRAYCATZ_DICTATORS=denis. Дальше модераторов назначают через API.
straycatz.moderation.dictators=${STRAYCATZ_DICTATORS: induk_burmalduk, auriel}
# Имена realm-ролей в Keycloak (необязательный второй источник).
straycatz.moderation.moderator-role=moderator
straycatz.moderation.dictator-role=dictator
# Дублировать назначения модераторов из API ещё и realm-ролью в Keycloak (нужен view-realm у straycatz-backend)
straycatz.moderation.keycloak-sync=false
# Сколько разных людей должны пожаловаться, чтобы тикет попал в очередь (в чате на N человек — не больше N-1, в личке 1)
straycatz.moderation.report-threshold=5
# Жалоб от одного человека в сутки
straycatz.moderation.reports-per-day=30
